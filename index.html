<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Two Worlds</title><style>*{box-sizing:border-box}body{margin:0;background:#a9d8e8;font:16px system-ui;color:white;touch-action:none}canvas{display:block}#menu{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#18394ddd;z-index:3;padding:24px}textarea{width:min(85vw,480px);height:55px;border-radius:10px;padding:8px;font:14px system-ui;touch-action:auto}#menu{overflow:auto;place-content:safe center;touch-action:pan-y}#msg{max-width:480px;margin:8px auto}h1{font-size:36px;margin:0}button,input{font:inherit;padding:14px;border:0;border-radius:14px;margin:6px;background:#fff;color:#18394d}button{font-weight:bold}#hud{position:fixed;top:12px;left:12px;right:12px;pointer-events:none;text-shadow:0 2px 4px #234}#pad{position:fixed;bottom:30px;left:25px;width:130px;height:130px;border-radius:50%;background:#ffffff40;border:2px solid #fff8}#knob{position:absolute;left:42px;top:42px;width:42px;height:42px;border-radius:50%;background:#fff9}#jump{position:fixed;bottom:48px;right:25px;border-radius:50%;width:85px;height:85px;background:#ffffffbb}#msg{color:#ffd5a5}#menu{background:linear-gradient(110deg,#102b3aef,#102b3a99);backdrop-filter:blur(5px)}#menu h1{font-family:Georgia,serif;font-size:clamp(32px,7vw,64px);letter-spacing:2px;color:#f6dfaa}#menu button{background:#284d59;color:#f8e9c6;border:1px solid #a8b6a5;padding:9px 18px;margin:3px}#menu #solo{background:#d6bc7d!important;color:#243b39}#menu textarea{height:40px;background:#183541;color:white;border:1px solid #829d9a}#menu p{margin:5px}#hud{max-width:65%;background:#102b3ab0;padding:10px 15px;border-radius:12px;font-size:14px;white-space:pre-line}#full{position:fixed;right:8px;top:8px;background:#173b4aaa;color:white;padding:8px 14px}#rotate{display:none;position:fixed;top:65px;left:10%;width:80%;text-align:center;background:
