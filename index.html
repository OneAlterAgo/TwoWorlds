<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Two Worlds</title><style>*{box-sizing:border-box}body{margin:0;background:#a9d8e8;font:16px system-ui;color:white;touch-action:none}canvas{display:block}#menu{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#18394ddd;z-index:3;padding:24px}textarea{width:min(85vw,480px);height:55px;border-radius:10px;padding:8px;font:14px system-ui;touch-action:auto}#menu{overflow:auto;place-content:safe center;touch-action:pan-y}#msg{max-width:480px;margin:8px auto}h1{font-size:36px;margin:0}button,input{font:inherit;padding:14px;border:0;border-radius:14px;margin:6px;background:#fff;color:#18394d}button{font-weight:bold}#hud{position:fixed;top:12px;left:12px;right:12px;pointer-events:none;text-shadow:0 2px 4px #234}#pad{position:fixed;bottom:30px;left:25px;width:130px;height:130px;border-radius:50%;background:#ffffff40;border:2px solid #fff8}#knob{position:absolute;left:42px;top:42px;width:42px;height:42px;border-radius:50%;background:#fff9}#jump{position:fixed;bottom:48px;right:25px;border-radius:50%;width:85px;height:85px;background:#ffffffbb}#msg{color:#ffd5a5}</style><div id="menu"><h1>Two Worlds</h1><p>Два героя. Один путь.</p><button id="create">Создать приглашение</button><textarea id="code" placeholder="Вставьте полученный код"></textarea><button id="join">Ответить на приглашение</button><button id="finish">Завершить подключение</button><textarea id="out" readonly placeholder="Исходящий код"></textarea><button id="copy">Копировать код</button><p id="msg"></p></div><div id="hud"></div><div id="pad"><div id="knob"></div></div><button id="jump">Прыжок</button><script type="module" src="./game.js"></script></html>
